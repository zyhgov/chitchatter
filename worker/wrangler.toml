# worker/wrangler.toml
name = "chitchatter-signaling"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# ❌ 不要在这里配置 routes（会导致冲突）
# routes = [...]

[durable_objects]
bindings = [
  { name = "SIGNALING_ROOM", class_name = "SignalingRoom" }
]

